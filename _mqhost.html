<!DOCTYPE html>
<!-- TEMPORARY test harness: renders index.html inside an iframe of an exact
     width so media queries see a real phone viewport. Delete after testing. -->
<html>
<head><meta charset="utf-8"/><title>mq harness</title></head>
<body style="margin:0;background:#222">
<iframe id="f" style="width:390px;height:844px;border:0;background:#080c18;display:block"></iframe>
<script>
var p = new URLSearchParams(location.search);
var w = Number(p.get('w') || 390);
var f = document.getElementById('f');
f.style.width = w + 'px';
f.style.height = Number(p.get('h') || 844) + 'px';
f.src = '_mq.html' + location.search;
</script>
</body>
</html>
